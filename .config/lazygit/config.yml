gui:
  skipDiscardChangeWarning: true
os:
  # Copy through the terminal (OSC 52) instead of a clipboard tool, so lazygit
  # running in a devcontainer -- where there is no X display -- still lands in
  # the host clipboard. Works on the host too, as long as lazygit runs in kitty
  # (it supports OSC 52); this file is shared by both.
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
